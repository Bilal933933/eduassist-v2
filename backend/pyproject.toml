[project]
name = "eduassist-backend"
version = "0.1.0"
description = "الواجهة الخلفية لمساعد التعليم (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "langgraph>=1.2.12",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.15.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "alembic>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
