services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: eduassist
      POSTGRES_USER: eduassist
      POSTGRES_PASSWORD: eduassist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduassist -d eduassist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
